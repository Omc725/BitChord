name: Android Release APK

on:
  push:
    branches:
      - main
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-prod-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Setup Secrets (Keystore & local.properties)
      run: |
        echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
        echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

        if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
          echo "Using configured repository secrets for keystore signing"
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > bitchord-release.jks
          printf "storeFile=bitchord-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" \
            "${{ secrets.KEYSTORE_PASSWORD }}" "${{ secrets.KEY_ALIAS }}" "${{ secrets.KEY_PASSWORD }}" > keystore.properties
        else
          echo "Generating a randomized standalone signing keystore..."
          RAND_PASS=$(openssl rand -hex 16)
          RAND_ALIAS="bitchord_$(openssl rand -hex 6)"
          RAND_DNAME="CN=$RAND_ALIAS, OU=$(openssl rand -hex 4), O=BitChord, L=Unknown, ST=Unknown, C=US"
          keytool -genkey -v \
            -keystore bitchord-release.jks \
            -alias "$RAND_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$RAND_PASS" \
            -keypass "$RAND_PASS" \
            -dname "$RAND_DNAME"
          printf "storeFile=bitchord-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" \
            "$RAND_PASS" "$RAND_ALIAS" "$RAND_PASS" > keystore.properties
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Signed Prod Release APK
      run: ./gradlew assembleProdRelease

    - name: Prepare Release Assets
      run: |
        mkdir -p release-assets
        for apk in app/build/outputs/apk/prod/release/*.apk; do
          [ -f "$apk" ] || continue
          fname=$(basename "$apk")
          if [[ "$fname" == *"-universal-"* ]]; then
            cp "$apk" release-assets/BitChord-universal.apk
          elif [[ "$fname" == *"-arm64-v8a-"* ]]; then
            cp "$apk" release-assets/BitChord-arm64-v8a.apk
          elif [[ "$fname" == *"-armeabi-v7a-"* ]]; then
            cp "$apk" release-assets/BitChord-armeabi-v7a.apk
          elif [[ "$fname" == *"-x86_64-"* ]]; then
            cp "$apk" release-assets/BitChord-x86_64.apk
          else
            cp "$apk" release-assets/"$fname"
          fi
        done
        echo "=== Prepared Release Assets ==="
        ls -lh release-assets/

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bitchord-apks
        path: release-assets/*.apk
        if-no-files-found: error

    - name: Upload Wear OS APK Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: bitchord-wear-prod-release-signed
        path: wearos/build/outputs/apk/prod/release/*.apk
        if-no-files-found: ignore

    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
        name: ${{ startsWith(github.ref, 'refs/tags/') && format('BitChord {0}', github.ref_name) || 'BitChord Latest Release' }}
        body: |
          ### 📱 BitChord Release APK Paketleri
          
          Bu sürüm GitHub Actions tarafından otomatik olarak derlenmiş, R8 ile sıkıştırılmış ve imzalanmıştır:
          - **BitChord-arm64-v8a.apk**: Modern Android telefonların büyük çoğunluğu için önerilen paket (düşük dosya boyutu).
          - **BitChord-universal.apk**: Tüm işlemci mimarilerini (ARMv7, ARM64, x86_64) içeren evrensel paket.
          - **BitChord-armeabi-v7a.apk**: Eski 32-bit ARM cihazlar için paket.
          - **BitChord-x86_64.apk**: Emülatör ve x86_64 cihazlar için paket.
          
          **Yenilikler / Düzeltmeler:**
          - 🎵 **24-bit FLAC Desteği:** FFmpeg kod çözücüsü entegrasyonu ile 24-bit FLAC dosyaları artık 16-bit'e kırpılmadan tam çözünürlükte çalınır.
          - ⚡ **R8 Minify & Shrink Resources:** Kod ve kullanılmayan kaynaklar temizlenip sıkıştırılmıştır.
          - 🔑 **İmzalı:** Rastgele oluşturulmuş imza sertifikası ile imzalanmıştır, doğrudan cihaza yüklenebilir.
        draft: false
        prerelease: false
        make_latest: true
        files: release-assets/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
